workflows:
  - id: "new-lead-nurture"
    status: active
  - id: "admin-welcome"
    status: active

triggers:
  - id: "trigger_1"
    eventName: "form_submitted"
  - id: "trigger_2"
    eventName: "user_signed_up"

workflow_triggers:
  - workflowId: "new-lead-nurture"
    triggerId: "trigger_1"
    initialStepId: "step_1"
    status: active
  - workflowId: "admin-welcome"
    triggerId: "trigger_2"
    initialStepId: "admin_step_1"
    status: active

workflow_actions:
  - id: "step_1"
    workflowId: "new-lead-nurture"
    type: "send_email"
    params:
      template: "welcome_email"
    nextStepId: "step_2"
  - id: "step_2"
    workflowId: "new-lead-nurture"
    type: "wait"
    params:
      durationMs: 10000 # 10 sec
    nextStepId: "step_3"
  - id: "step_3"
    workflowId: "new-lead-nurture"
    type: "condition"
    params:
      conditions:
        - type: "has_tag"
          params:
            tag: "replied"
          branch: "yes"
      defaultBranch: "no"
    branches:
      "yes": "step_4_yes"
      "no": "step_4_no"
  - id: "step_4_yes"
    workflowId: "new-lead-nurture"
    type: "add_tag"
    params:
      tag: "engaged"
    nextStepId: "step_5"
  - id: "step_5"
    workflowId: "new-lead-nurture"
    type: "call_webhook"
    params:
      url: "https://httpbin.org/post"
  - id: "step_4_no"
    workflowId: "new-lead-nurture"
    type: "wait"
    params:
      durationMs: 30000 # 30 Sec
    nextStepId: "step_5_no"
  - id: "step_5_no"
    workflowId: "new-lead-nurture"
    type: "send_email"
    params:
      template: "followup_email"
  - id: "admin_step_1"
    workflowId: "admin-welcome"
    type: "condition"
    params:
      conditions:
        - type: "jexl"
          params:
            expression: "'admin' in contact.tags"
          branch: "is_admin"
      defaultBranch: "not_admin"
    branches:
      "is_admin": "admin_step_2_yes"
  - id: "admin_step_2_yes"
    workflowId: "admin-welcome"
    type: "send_email"
    params:
      template: "admin_template"
